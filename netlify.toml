[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

# The service worker must always be re-checked so a new deploy reaches people.
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

# Security headers. Updated to allow Supabase CDN and Open-Meteo.
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), camera=(), microphone=()"
